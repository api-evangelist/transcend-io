summary: |
  Transcend is a tier-1 privacy and data permissioning platform with a serious
  developer surface — REST and GraphQL APIs, a TypeScript SDK and CLI in a
  shared monorepo, eight per-domain MCP servers for AI-agent integration, a
  Terraform provider, Helm charts, native iOS and Android consent SDKs, and a
  customer-deployed Sombra gateway so Transcend itself never sees customer data
  or API keys. The platform spans data inventory, DSR automation, consent and
  preference management, privacy assessments, AI governance, and an LLM
  classifier for unstructured data discovery. Documentation is thorough and a
  machine-readable OpenAPI spec (3.0 and 3.1) is published. Pricing is gated
  behind sales.

strengths:
  - Real OpenAPI 3.1 and 3.0 specs published at docs.transcend.io/api/oas.json
  - Eight per-domain MCP servers (admin, assessment, consent, discovery, DSR, inventory, preferences, workflows) plus an aggregate package
  - First-class infrastructure: Terraform provider, Helm charts, Sombra gateway Terraform module
  - Data Map as Code via transcend.yml and the @transcend-io/cli
  - Multi-region backends (EU default, US opt-in) with consistent path-level contract
  - Customer-deployed Sombra gateway eliminates a major trust boundary

opportunities:
  - Publish per-tier rate limits on docs.transcend.io rather than communicating them only via contract
  - Document the GraphQL API schema publicly alongside the REST OpenAPI
  - Public pricing scaffold would lower friction for self-serve evaluation
  - Operation-level descriptions are sparse on some endpoints (Spectral warnings present)

tier: 1

