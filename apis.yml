  - name: Agent-Friendly Privacy Ops
    description: >-
      Expose Transcend admin, assessment, consent, discovery, DSR, inventory, preferences, and workflow
      operations to AI agents via MCP.
  - name: Per-Domain Servers
    description: >-
      Eight scoped MCP servers let agents work against a single Transcend domain rather than the full
      API surface.
  useCases:
