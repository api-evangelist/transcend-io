capability: dsr-fulfillment
name: Data Subject Request Fulfillment
description: |
  End-to-end DSR fulfillment workflow using the Transcend API: enrich identifiers,
  poll the request, retrieve download keys, and stream results back to the requester.
version: "0.1"
uses:
  - shared/transcend-api.yaml
workflow:
  - step: submit
    operation: submitDataSubjectRequest
    description: Submit an ACCESS, ERASURE, OPT_IN, or OPT_OUT request on behalf of a data subject.
  - step: enrich
    operation: enrichIdentifiers
    description: Enrich the request with additional identifiers (userId, phone) before fan-out.
  - step: poll
    operation: getDataSubjectRequest
    description: Poll the DSR until status is COMPLETED, FAILED, REJECTED, or REVOKED.
    condition: status == "IN_PROGRESS"
  - step: collect
    operation: getDataSubjectRequestDownloadKeys
    description: Retrieve signed download URLs for files produced during access fulfillment.
  - step: deliver
    description: Deliver the package to the requester through your channel of choice and record consent of release.
inputs:
  type:
    description: DSR type
    enum: [ACCESS, ERASURE, OPT_IN, OPT_OUT]
  subject:
    description: The data subject identifier (email, phone, or user id)
outputs:
  downloadKeys:
    description: Signed URLs for any access-request artifacts.
