capability: custom-integration
name: Custom Data Silo Integration
description: |
  Connect an internal system to Transcend as a custom data silo and respond to
  access, erasure, opt-in, and opt-out requests routed through Transcend.
version: "0.1"
uses:
  - shared/transcend-api.yaml
workflow:
  - step: register
    operation: createDataSilo
    description: Register or sync your custom data silo with Transcend.
  - step: poll
    operation: listDataSiloPendingRequests
    description: Poll the silo for pending ACCESS, ERASURE, OPT_IN, or OPT_OUT requests.
  - step: respond-access
    operations:
      - pushDatapoints
      - pushChunkedDatapoints
      - listFiles
    description: Stream files or push JSON datapoints in response to access requests.
  - step: respond-mutation
    operation: updateDataSilo
    description: Use PUT /v1/data-silo to acknowledge erasure, opt-in, or opt-out completion.
inputs:
  dataSiloId:
    description: The data silo identifier in Transcend
outputs:
  pendingCount:
    description: Number of pending requests resolved in this run
