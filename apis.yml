    description: >-
      Let an AI agent answer privacy questions, draft assessments, and manage consent through scoped MCP
      servers.
  - name: Automated Privacy Operations
    description: >-
      Orchestrate DSR fulfillment, inventory updates, and preference syncs from agent-driven workflows.
